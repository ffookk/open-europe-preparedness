name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Privacy guard
        run: python scripts/privacy_check.py --history
      - name: English contribution policy
        run: python scripts/check_english.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate documented examples
        run: python scripts/validate_records.py data/verified.json data/pending.json examples/synthetic.json

  browser:
    name: Offline browsers (Chromium and Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install locked browser development tools
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/browser
      - name: Install pinned browser engines
        working-directory: tools/browser
        run: npx --no-install playwright install --with-deps chromium firefox
      - name: Run offline fictional browser regressions
        run: npm test --prefix tools/browser

  validate:
    name: validate
    if: ${{ always() }}
    needs: [tests, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test job to succeed
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BROWSER_RESULT" = success
